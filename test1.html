<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learny - Community Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151c2c;
      --bg-sidebar: #111827;
      --bg-hover: #1f293d;
      --bg-input: #1b2436;
      --border-color: #232d42;
      --text-main: #f3f4f6;
      --text-muted: #8b96a8;
      --accent-blue: #0284c7;
      --accent-hover: #0369a1;
      --accent-green: #10b981;
      --accent-pending: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    
    body { 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 20px; 
    }
    
    .chat-container { 
      display: flex; 
      width: 100%; 
      max-width: 1100px; 
      height: 88vh; 
      background: var(--bg-card); 
      border-radius: 16px; 
      overflow: hidden; 
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); 
    }
    
    /* Sidebar */
    .sidebar { 
      width: 360px; 
      background: var(--bg-sidebar); 
      display: flex; 
      flex-direction: column; 
      border-right: 1px solid var(--border-color); 
    }

    .user-profile { 
      padding: 18px 20px; 
      background: var(--bg-sidebar); 
      border-bottom: 1px solid var(--border-color); 
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-placeholder {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      font-size: 16px;
    }

    .user-info { flex: 1; min-width: 0; }
    .user-info .username { font-weight: 600; font-size: 15px; color: var(--text-main); text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .user-info .my-id { font-size: 12px; color: #38bdf8; font-weight: 500; margin-top: 2px; }

    /* Navigation Tabs */
    .tab-navigation {
      display: flex;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 12px 16px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border-bottom: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn:hover { color: var(--text-main); background: var(--bg-hover); }
    .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; background: rgba(56, 189, 248, 0.05); }

    .tab-badge {
      background: var(--accent-blue);
      color: white;
      font-size: 10px;
      border-radius: 10px;
      padding: 2px 6px;
      font-weight: 700;
    }

    /* Tab Panels */
    .tab-content { flex: 1; overflow-y: auto; display: none; }
    .tab-content.active { display: block; }

    /* Tab 1: Direct Messages List */
    .contact-item { 
      padding: 14px 20px; 
      display: flex; 
      align-items: center; 
      gap: 12px;
      cursor: pointer; 
      border-bottom: 1px solid rgba(255, 255, 255, 0.02); 
      transition: background 0.15s ease;
    }
    .contact-item:hover { background: var(--bg-hover); }
    .contact-item.active { background: #1e293b; border-left: 3px solid #38bdf8; }

    .contact-details { flex: 1; min-width: 0; }
    .contact-details .name { font-weight: 600; font-size: 14px; color: var(--text-main); }
    .contact-details .chat-id-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* Tab 2: Discover & Connections */
    .add-contact-box { padding: 16px; border-bottom: 1px solid var(--border-color); }
    .add-contact-box label { display: block; font-size: 11px; text-transform: uppercase; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
    .input-group { display: flex; gap: 8px; }
    .input-group input { 
      flex: 1; 
      padding: 10px 12px; 
      background: var(--bg-input); 
      border: 1px solid var(--border-color); 
      border-radius: 8px; 
      color: #fff; 
      font-size: 13px; 
      outline: none;
    }
    .input-group input:focus { border-color: #0284c7; }
    .input-group button { 
      padding: 10px 16px; 
      background: var(--accent-blue); 
      color: white; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 13px;
      transition: background 0.2s;
    }
    .input-group button:hover { background: var(--accent-hover); }

    .section-title { padding: 14px 20px 6px; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    
    .request-item {
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    }
    
    .status-pill { font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: 600; }
    .status-pill.pending { background: rgba(245, 158, 11, 0.15); color: #fcd34d; }
    .status-pill.accepted { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }

    .req-btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .btn-accept { background: var(--accent-green); color: white; }
    .btn-accept:hover { background: #059669; }

    /* Chat Section */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-card); }
    .chat-header { 
      padding: 18px 24px; 
      background: var(--bg-sidebar); 
      border-bottom: 1px solid var(--border-color); 
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-header .header-info { display: flex; align-items: center; gap: 12px; }
    .chat-header .title { font-weight: 600; font-size: 15px; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--text-muted);
      text-align: center;
      padding: 20px;
    }
    .empty-state svg { width: 64px; height: 64px; fill: var(--border-color); margin-bottom: 16px; }

    .messages-box { 
      flex: 1; 
      padding: 24px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
    }
    .message { 
      max-width: 60%; 
      padding: 12px 16px; 
      border-radius: 12px; 
      font-size: 14px; 
      line-height: 1.5; 
      word-break: break-word;
      position: relative;
    }
    .message.sent { 
      align-self: flex-end; 
      background: var(--accent-blue); 
      color: white; 
      border-bottom-right-radius: 2px; 
    }
    .message.received { 
      align-self: flex-start; 
      background: var(--bg-input); 
      color: var(--text-main); 
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 2px; 
    }
    .message .timestamp {
      font-size: 10px;
      margin-top: 4px;
      opacity: 0.7;
      text-align: right;
    }

    .chat-input-area { 
      padding: 16px 24px; 
      background: var(--bg-sidebar); 
      display: flex; 
      gap: 12px; 
      border-top: 1px solid var(--border-color); 
    }
    .chat-input-area input { 
      flex: 1; 
      padding: 12px 16px; 
      background: var(--bg-input); 
      border: 1px solid var(--border-color); 
      border-radius: 8px; 
      color: white; 
      font-size: 14px;
      outline: none;
    }
    .chat-input-area input:focus { border-color: var(--accent-blue); }
    .chat-input-area button { 
      padding: 12px 20px; 
      background: var(--accent-blue); 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-weight: 600; 
      cursor: pointer; 
      transition: background 0.2s;
    }
    .chat-input-area button:hover:not(:disabled) { background: var(--accent-hover); }
    .chat-input-area input:disabled, .chat-input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="chat-container">
  <!-- Left Sidebar -->
  <div class="sidebar">
    <div class="user-profile">
      <div class="avatar-placeholder" id="myAvatar">?</div>
      <div class="user-info">
        <div class="username" id="myUsername">Connecting...</div>
        <div class="my-id" id="myChatId">Chat ID: ---</div>
      </div>
    </div>
    
    <!-- Tab Controls -->
    <div class="tab-navigation">
      <button class="tab-btn active" id="tabBtnChats">
        Chats
      </button>
      <button class="tab-btn" id="tabBtnDiscover">
        Find / Add
        <span class="tab-badge" id="reqBadge" style="display:none;">0</span>
      </button>
    </div>

    <!-- Tab 1 Panel: Active Direct Messages -->
    <div class="tab-content active" id="tabChats">
      <div id="chatsList"></div>
    </div>

    <!-- Tab 2 Panel: Add Contact & Manage Requests -->
    <div class="tab-content" id="tabDiscover">
      <div class="add-contact-box">
        <label>Connect with Student</label>
        <div class="input-group">
          <input type="text" id="targetChatId" placeholder="Enter ID (e.g. LRN-1102)">
          <button id="sendReqBtn">Send</button>
        </div>
      </div>

      <div class="section-title">Incoming Requests</div>
      <div id="incomingRequestsList"></div>

      <div class="section-title">Sent Requests</div>
      <div id="sentRequestsList"></div>
    </div>
  </div>

  <!-- Right Chat Area -->
  <div class="chat-area">
    <div class="chat-header">
      <div class="header-info">
        <div class="title" id="chatHeaderTitle">Select a contact to start chatting</div>
      </div>
    </div>

    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12z"/></svg>
      <p>Choose an existing connection or add a friend using their Chat ID to begin messaging.</p>
    </div>

    <div class="messages-box" id="messagesBox" style="display: none;"></div>

    <div class="chat-input-area">
      <input type="text" id="messageInput" placeholder="Type your message here..." disabled>
      <button id="sendMsgBtn" disabled>Send</button>
    </div>
  </div>
</div>

<!-- Firebase Modular SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { 
    getAuth, 
    signInAnonymously, 
    onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { 
    getFirestore, 
    doc, 
    getDoc, 
    setDoc, 
    addDoc, 
    updateDoc, 
    collection, 
    query, 
    where, 
    orderBy, 
    onSnapshot, 
    getDocs, 
    serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBguApS0wRuiarK1djIg0eltnAv-1E5DJI",
    authDomain: "lrnchat-2b76f.firebaseapp.com",
    projectId: "lrnchat-2b76f",
    storageBucket: "lrnchat-2b76f.firebasestorage.app",
    messagingSenderId: "931919499161",
    appId: "1:931919499161:web:33f96dde96a3400d06cd08"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentUserData = null;
  let activeChatUserId = null;
  let activeChatUnsubscribe = null;

  // Tab Switcher Logic
  const tabBtnChats = document.getElementById('tabBtnChats');
  const tabBtnDiscover = document.getElementById('tabBtnDiscover');
  const tabChats = document.getElementById('tabChats');
  const tabDiscover = document.getElementById('tabDiscover');

  tabBtnChats.addEventListener('click', () => {
    tabBtnChats.classList.add('active');
    tabBtnDiscover.classList.remove('active');
    tabChats.classList.add('active');
    tabDiscover.classList.remove('active');
  });

  tabBtnDiscover.addEventListener('click', () => {
    tabBtnDiscover.classList.add('active');
    tabBtnChats.classList.remove('active');
    tabDiscover.classList.add('active');
    tabChats.classList.remove('active');
  });

  // Authentication Setup
  signInAnonymously(auth).catch(console.error);

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      const userRef = doc(db, 'users', user.uid);
      const userSnap = await getDoc(userRef);

      if (!userSnap.exists()) {
        const randomId = 'LRN-' + Math.floor(1000 + Math.random() * 9000);
        currentUserData = {
          username: 'Student_' + user.uid.substring(0, 4),
          chatId: randomId
        };
        await setDoc(userRef, currentUserData);
      } else {
        currentUserData = userSnap.data();
      }

      document.getElementById('myUsername').innerText = currentUserData.username;
      document.getElementById('myChatId').innerText = `Chat ID: ${currentUserData.chatId}`;
      document.getElementById('myAvatar').innerText = currentUserData.username.charAt(8) || 'S';

      listenToRequestsAndContacts();
    }
  });

  // Send Connection Request
  document.getElementById('sendReqBtn').addEventListener('click', sendConnectionRequest);
  async function sendConnectionRequest() {
    const targetId = document.getElementById('targetChatId').value.trim();
    if (!targetId || targetId === currentUserData.chatId) return;

    const q = query(collection(db, 'users'), where('chatId', '==', targetId));
    const querySnap = await getDocs(q);

    if (querySnap.empty) {
      alert('Chat ID not found!');
      return;
    }

    const targetUserDoc = querySnap.docs[0];
    const receiverId = targetUserDoc.id;

    await addDoc(collection(db, 'requests'), {
      senderId: currentUser.uid,
      senderChatId: currentUserData.chatId,
      receiverId: receiverId,
      receiverChatId: targetId,
      status: 'pending',
      createdAt: serverTimestamp()
    });

    alert('Request Sent!');
    document.getElementById('targetChatId').value = '';
  }

  // Realtime Sidebar Syncing
  function listenToRequestsAndContacts() {
    const qSent = query(collection(db, 'requests'), where('senderId', '==', currentUser.uid));
    const qReceived = query(collection(db, 'requests'), where('receiverId', '==', currentUser.uid));

    let requestsMap = new Map();

    const render = () => {
      const chatsContainer = document.getElementById('chatsList');
      const incomingContainer = document.getElementById('incomingRequestsList');
      const sentContainer = document.getElementById('sentRequestsList');

      chatsContainer.innerHTML = '';
      incomingContainer.innerHTML = '';
      sentContainer.innerHTML = '';

      let pendingIncomingCount = 0;

      requestsMap.forEach((req, reqId) => {
        // Active Accepted Chats (Tab 1)
        if (req.status === 'accepted') {
          const otherUserId = req.senderId === currentUser.uid ? req.receiverId : req.senderId;
          const otherChatId = req.senderId === currentUser.uid ? req.receiverChatId : req.senderChatId;
          
          const item = document.createElement('div');
          item.className = `contact-item ${activeChatUserId === otherUserId ? 'active' : ''}`;
          item.innerHTML = `
            <div class="avatar-placeholder" style="width:36px; height:36px; font-size:12px;">S</div>
            <div class="contact-details">
              <div class="name">Student Connection</div>
              <div class="chat-id-sub">${otherChatId}</div>
            </div>`;
          item.onclick = () => openChat(otherUserId, otherChatId);
          chatsContainer.appendChild(item);
        }

        // Incoming Pending Requests (Tab 2)
        if (req.status === 'pending' && req.receiverId === currentUser.uid) {
          pendingIncomingCount++;
          const item = document.createElement('div');
          item.className = 'request-item';
          item.innerHTML = `
            <div>
              <div style="font-weight:600; font-size:13px;">${req.senderChatId}</div>
              <div style="font-size:11px; color:var(--text-muted);">Wants to connect</div>
            </div>
            <button class="req-btn btn-accept" id="acc-${reqId}">Accept</button>`;
          incomingContainer.appendChild(item);

          setTimeout(() => {
            const btn = document.getElementById(`acc-${reqId}`);
            if (btn) btn.onclick = () => acceptRequest(reqId, req.senderId);
          }, 0);
        }

        // Sent Pending Requests (Tab 2)
        if (req.status === 'pending' && req.senderId === currentUser.uid) {
          const item = document.createElement('div');
          item.className = 'request-item';
          item.innerHTML = `
            <div>
              <div style="font-weight:600; font-size:13px;">${req.receiverChatId}</div>
            </div>
            <span class="status-pill pending">Pending</span>`;
          sentContainer.appendChild(item);
        }
      });

      // Update Badge Counter
      const reqBadge = document.getElementById('reqBadge');
      if (pendingIncomingCount > 0) {
        reqBadge.innerText = pendingIncomingCount;
        reqBadge.style.display = 'inline-block';
      } else {
        reqBadge.style.display = 'none';
      }
    };

    onSnapshot(qSent, (snap) => {
      snap.docs.forEach(doc => requestsMap.set(doc.id, doc.data()));
      render();
    });

    onSnapshot(qReceived, (snap) => {
      snap.docs.forEach(doc => requestsMap.set(doc.id, doc.data()));
      render();
    });
  }

  // Accept Connection
  async function acceptRequest(requestId, senderId) {
    await updateDoc(doc(db, 'requests', requestId), { status: 'accepted' });

    const chatDocId = [currentUser.uid, senderId].sort().join('_');
    await setDoc(doc(db, 'chats', chatDocId), {
      members: [currentUser.uid, senderId],
      updatedAt: serverTimestamp()
    }, { merge: true });
  }

  // Open Messaging Stream
  function openChat(otherUserId, otherChatId) {
    activeChatUserId = otherUserId;
    
    // UI Layout Toggles
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('messagesBox').style.display = 'flex';
    document.getElementById('chatHeaderTitle').innerText = `Chatting with ${otherChatId}`;
    document.getElementById('messageInput').disabled = false;
    document.getElementById('sendMsgBtn').disabled = false;

    if (activeChatUnsubscribe) activeChatUnsubscribe();

    const chatDocId = [currentUser.uid, otherUserId].sort().join('_');
    const messagesRef = collection(db, 'chats', chatDocId, 'messages');
    const q = query(messagesRef, orderBy('createdAt', 'asc'));

    activeChatUnsubscribe = onSnapshot(q, (snapshot) => {
      const messagesBox = document.getElementById('messagesBox');
      messagesBox.innerHTML = '';

      snapshot.docs.forEach((doc) => {
        const data = doc.data();
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${data.senderId === currentUser.uid ? 'sent' : 'received'}`;
        
        let timeStr = 'Just now';
        if (data.createdAt) {
          const date = data.createdAt.toDate();
          timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        msgDiv.innerHTML = `
          <div>${data.text}</div>
          <div class="timestamp">${timeStr}</div>
        `;
        messagesBox.appendChild(msgDiv);
      });

      messagesBox.scrollTop = messagesBox.scrollHeight;
    });
  }

  // Messaging Key Bindings & Submissions
  document.getElementById('sendMsgBtn').addEventListener('click', sendMessage);
  document.getElementById('messageInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text || !activeChatUserId) return;

    const chatDocId = [currentUser.uid, activeChatUserId].sort().join('_');
    await addDoc(collection(db, 'chats', chatDocId, 'messages'), {
      senderId: currentUser.uid,
      text: text,
      createdAt: serverTimestamp()
    });

    input.value = '';
  }
</script>
</body>
</html>
