<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learny - Virtual Study Room</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; }
    .flex { display: flex; gap: 12px; }
    input, button { padding: 12px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; outline: none; }
    button { background: #2563eb; cursor: pointer; border: none; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    
    .timer-box { text-align: center; padding: 30px 20px; }
    .timer { font-size: 4rem; font-weight: 800; color: #38bdf8; margin: 10px 0; }
    .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: bold; background: #0284c7; }
    .badge.BREAK { background: #16a34a; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    
    .chat-box { height: 160px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #334155; }
    .chat-msg { margin-bottom: 6px; font-size: 0.85rem; }
    .user-tag { background: #334155; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 0.9rem; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <!-- Setup Screen -->
  <div id="setup-section" class="card">
    <h2>🎯 Learny Virtual Study Room</h2>
    <input type="text" id="user-name" placeholder="Your Name (e.g., Kasun)" style="width: 100%; margin-bottom: 20px;" />
    
    <div class="grid">
      <div>
        <h3>Create New Room</h3>
        <input type="text" id="new-room-name" placeholder="Room Name" style="width: 100%; margin-bottom: 10px;" />
        <div class="flex" style="margin-bottom: 10px;">
          <input type="number" id="focus-mins" value="25" placeholder="Focus (m)" style="width: 50%;" />
          <input type="number" id="break-mins" value="5" placeholder="Break (m)" style="width: 50%;" />
        </div>
        <button id="btn-create" style="width: 100%;">Create Room</button>
      </div>

      <div>
        <h3>Join Room</h3>
        <input type="text" id="join-room-id" placeholder="Enter Room ID" style="width: 100%; margin-bottom: 10px;" />
        <button id="btn-join" style="width: 100%;">Join Room</button>
      </div>
    </div>
  </div>

  <!-- Study Room Screen -->
  <div id="room-section" class="card hidden">
    <div class="flex" style="justify-content: space-between; align-items: center;">
      <h2 id="display-room-title">Study Room</h2>
      <span id="room-id-tag" style="color: #94a3b8; font-family: monospace;"></span>
    </div>

    <div class="timer-box">
      <span id="phase-badge" class="badge">FOCUS MODE</span>
      <div id="timer-display" class="timer">00:00</div>
      <p id="chat-status-msg" style="color: #94a3b8; font-size: 0.85rem;">🔒 Chat is locked during Focus sessions.</p>
    </div>

    <div class="grid">
      <div>
        <h3>Room Chat</h3>
        <div id="chat-box" class="chat-box"></div>
        <div class="flex">
          <input type="text" id="chat-input" placeholder="Break mode chat..." style="flex: 1;" disabled />
          <button id="send-btn" disabled>Send</button>
        </div>
      </div>

      <div>
        <h3>Students Online</h3>
        <div id="user-list"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
  import { 
    getDatabase, 
    ref, 
    set, 
    update, 
    onValue, 
    onChildAdded, 
    push, 
    onDisconnect 
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

  // Your Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCgPaCkohoVx6rXHAbQhk80R3EvncVkxx4",
    authDomain: "rooms-7a301.firebaseapp.com",
    projectId: "rooms-7a301",
    storageBucket: "rooms-7a301.firebasestorage.app",
    messagingSenderId: "588297268013",
    appId: "1:588297268013:web:51de1add5257a368f781a4",
    measurementId: "G-8TSVQFH3EN",
    databaseURL: "https://rooms-7a301-default-rtdb.firebaseio.com"
  };

  // Initialize Firebase & Realtime Database
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const db = getDatabase(app);

  let currentRoomId = "";
  let userName = "";
  let userId = "usr_" + Math.random().toString(36).substr(2, 6);
  let timerInterval = null;

  function generateRoomId(name) {
    const code = Math.random().toString(36).substring(2, 6);
    const prefix = (name || "room").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 4);
    return `${prefix}-${code}`;
  }

  // Create Room
  document.getElementById("btn-create").addEventListener("click", () => {
    const roomName = document.getElementById("new-room-name").value || "Study Room";
    const focusMins = parseInt(document.getElementById("focus-mins").value) || 25;
    const breakMins = parseInt(document.getElementById("break-mins").value) || 5;

    currentRoomId = generateRoomId(roomName);
    const endTime = Date.now() + focusMins * 60 * 1000;

    set(ref(db, "rooms/" + currentRoomId), {
      roomName,
      focusMins,
      breakMins,
      status: "FOCUS",
      endTime
    }).then(() => enterRoom(currentRoomId));
  });

  // Join Room
  document.getElementById("btn-join").addEventListener("click", () => {
    const roomId = document.getElementById("join-room-id").value.trim();
    if (roomId) enterRoom(roomId);
  });

  function enterRoom(roomId) {
    currentRoomId = roomId;
    userName = document.getElementById("user-name").value.trim() || "Student";

    document.getElementById("setup-section").classList.add("hidden");
    document.getElementById("room-section").classList.remove("hidden");
    document.getElementById("room-id-tag").innerText = `ID: ${roomId}`;

    // Presence Management
    const userRef = ref(db, `rooms/${roomId}/users/${userId}`);
    set(userRef, { name: userName });
    onDisconnect(userRef).remove();

    // Sync Room State
    onValue(ref(db, `rooms/${roomId}`), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      document.getElementById("display-room-title").innerText = data.roomName;
      updatePhase(data.status, data.endTime, data.focusMins, data.breakMins);
    });

    // Sync Online Users
    onValue(ref(db, `rooms/${roomId}/users`), (snapshot) => {
      const users = snapshot.val() || {};
      const userList = document.getElementById("user-list");
      userList.innerHTML = Object.values(users)
        .map(u => `<div class="user-tag">🎓 ${u.name}</div>`)
        .join("");
    });

    // Listen for Messages
    onChildAdded(ref(db, `rooms/${roomId}/messages`), (snapshot) => {
      const msg = snapshot.val();
      const box = document.getElementById("chat-box");
      box.innerHTML += `<div class="chat-msg"><strong>${msg.sender}:</strong> ${msg.text}</div>`;
      box.scrollTop = box.scrollHeight;
    });
  }

  function updatePhase(status, endTime, focusMins, breakMins) {
    const badge = document.getElementById("phase-badge");
    const chatInput = document.getElementById("chat-input");
    const sendBtn = document.getElementById("send-btn");

    badge.innerText = status === "FOCUS" ? "FOCUS MODE" : "BREAK TIME";
    badge.className = `badge ${status}`;

    const isFocus = status === "FOCUS";
    chatInput.disabled = isFocus;
    sendBtn.disabled = isFocus;
    document.getElementById("chat-status-msg").innerText = isFocus 
      ? "🔒 Chat is locked during Focus sessions." 
      : "🔓 Break time! Chat with your study room.";

    if (timerInterval) clearInterval(timerInterval);

    timerInterval = setInterval(() => {
      const remainingSecs = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
      
      if (remainingSecs === 0) {
        clearInterval(timerInterval);
        toggleRoomPhase(status, focusMins, breakMins);
      }

      const mins = String(Math.floor(remainingSecs / 60)).padStart(2, '0');
      const secs = String(remainingSecs % 60).padStart(2, '0');
      document.getElementById("timer-display").innerText = `${mins}:${secs}`;
    }, 500);
  }

  function toggleRoomPhase(currentStatus, focusMins, breakMins) {
    const nextStatus = currentStatus === "FOCUS" ? "BREAK" : "FOCUS";
    const nextDuration = nextStatus === "FOCUS" ? focusMins : breakMins;
    
    update(ref(db, `rooms/${currentRoomId}`), {
      status: nextStatus,
      endTime: Date.now() + nextDuration * 60 * 1000
    });
  }

  // Send Chat Message
  document.getElementById("send-btn").addEventListener("click", sendMessage);
  function sendMessage() {
    const input = document.getElementById("chat-input");
    if (input.value.trim()) {
      push(ref(db, `rooms/${currentRoomId}/messages`), {
        sender: userName,
        text: input.value
      });
      input.value = "";
    }
  }
</script>
</body>
</html>
