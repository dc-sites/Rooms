<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learny - Virtual Study Room</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; }
    .flex { display: flex; gap: 12px; }
    input, select, button { padding: 12px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; outline: none; }
    select { cursor: pointer; }
    button { background: #2563eb; cursor: pointer; border: none; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    .btn-success { background: #16a34a; }
    .btn-success:hover { background: #15803d; }
    
    .timer-box { text-align: center; padding: 20px; }
    .timer { font-size: 4rem; font-weight: 800; color: #38bdf8; margin: 10px 0; }
    .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: bold; background: #0284c7; }
    .badge.BREAK { background: #16a34a; }
    .badge.WAITING { background: #eab308; color: #0f172a; }

    .share-box { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 15px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    
    .chat-box { height: 160px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #334155; }
    .chat-msg { margin-bottom: 6px; font-size: 0.85rem; }
    .user-tag { background: #334155; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 0.9rem; display: flex; justify-content: space-between; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <!-- Setup Screen -->
  <div id="setup-section" class="card">
    <h2>Learny Virtual Study Room</h2>
    <input type="text" id="user-name" placeholder="Your Name (e.g., Kasun)" style="width: 100%; margin-bottom: 20px;" />
    
    <div class="grid">
      <div>
        <h3>Create New Room</h3>
        <input type="text" id="new-room-name" placeholder="Room Name" style="width: 100%; margin-bottom: 10px;" />
        
        <div class="flex" style="margin-bottom: 10px;">
          <div style="flex: 1;">
            <label style="font-size: 0.8rem; color: #94a3b8;">Max Students</label>
            <select id="max-students" style="width: 100%;">
              <option value="1">1 Student</option>
              <option value="2">2 Students</option>
              <option value="3">3 Students</option>
              <option value="4" selected>4 Students</option>
            </select>
          </div>
          <div style="flex: 1;">
            <label style="font-size: 0.8rem; color: #94a3b8;">Focus (m)</label>
            <input type="number" id="focus-mins" value="25" style="width: 100%;" />
          </div>
          <div style="flex: 1;">
            <label style="font-size: 0.8rem; color: #94a3b8;">Break (m)</label>
            <input type="number" id="break-mins" value="5" style="width: 100%;" />
          </div>
        </div>
        <button id="btn-create" style="width: 100%;">Create Room</button>
      </div>

      <div>
        <h3>Join Room</h3>
        <input type="text" id="join-room-id" placeholder="Enter Room ID" style="width: 100%; margin-bottom: 10px;" />
        <button id="btn-join" style="width: 100%;">Join Room</button>
      </div>
    </div>
  </div>

  <!-- Study Room Screen -->
  <div id="room-section" class="card hidden">
    <div class="flex" style="justify-content: space-between; align-items: center;">
      <h2 id="display-room-title">Study Room</h2>
      <span id="room-id-tag" style="color: #38bdf8; font-weight: bold; font-family: monospace; font-size: 1.1rem;"></span>
    </div>

    <!-- Share Link -->
    <div class="share-box flex" style="align-items: center; justify-content: space-between;">
      <div style="font-size: 0.85rem; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px;">
        🔗 Share Link: <span id="share-link-text" style="color: #fff;"></span>
      </div>
      <button id="btn-copy" style="padding: 6px 12px; font-size: 0.8rem;">Copy Link</button>
    </div>

    <div class="timer-box">
      <span id="phase-badge" class="badge WAITING">WAITING FOR HOST TO START</span>
      <div id="timer-display" class="timer">25:00</div>
      
      <!-- Host Start Button -->
      <button id="btn-start-session" class="btn-success hidden" style="font-size: 1.1rem; padding: 12px 28px; margin-top: 10px;">
        🚀 Start Study Session
      </button>

      <p id="chat-status-msg" style="color: #94a3b8; font-size: 0.85rem; margin-top: 10px;">
        ⏳ Waiting for participants to join...
      </p>
    </div>

    <div class="grid">
      <div>
        <h3>Room Chat</h3>
        <div id="chat-box" class="chat-box"></div>
        <div class="flex">
          <input type="text" id="chat-input" placeholder="Break mode chat..." style="flex: 1;" disabled />
          <button id="send-btn" disabled>Send</button>
        </div>
      </div>

      <div>
        <h3>Students Joined (<span id="user-count">0</span>/<span id="max-count">4</span>)</h3>
        <div id="user-list"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { 
    getDatabase, 
    ref, 
    set, 
    update, 
    onValue, 
    onChildAdded, 
    push, 
    onDisconnect,
    get 
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

  // Exact Firebase Config with Regional Singapore Database URL
  const firebaseConfig = {
    apiKey: "AIzaSyCgPaCkohoVx6rXHAbQhk80R3EvncVkxx4",
    authDomain: "rooms-7a301.firebaseapp.com",
    databaseURL: "https://rooms-7a301-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "rooms-7a301",
    storageBucket: "rooms-7a301.firebasestorage.app",
    messagingSenderId: "588297268013",
    appId: "1:588297268013:web:51de1add5257a368f781a4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let currentRoomId = "";
  let userName = "";
  let userId = "usr_" + Math.random().toString(36).substr(2, 6);
  let isHost = false;
  let timerInterval = null;

  function generateRoomId(name) {
    const code = Math.random().toString(36).substring(2, 6);
    const prefix = (name || "room").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 4);
    return `${prefix}-${code}`;
  }

  // Pre-fill Room ID if accessing via shared link (?room=ROOM_ID)
  window.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const roomIdFromUrl = urlParams.get("room");
    if (roomIdFromUrl) {
      document.getElementById("join-room-id").value = roomIdFromUrl;
    }
  });

  // Create Room Event Handler
  document.getElementById("btn-create").addEventListener("click", () => {
    const roomName = document.getElementById("new-room-name").value || "Study Room";
    const maxStudents = parseInt(document.getElementById("max-students").value) || 4;
    const focusMins = parseInt(document.getElementById("focus-mins").value) || 25;
    const breakMins = parseInt(document.getElementById("break-mins").value) || 5;

    // Generate Room ID instantly and set user as Host
    currentRoomId = generateRoomId(roomName);
    isHost = true;

    // Switch screen view immediately
    enterRoom(currentRoomId);

    // Save room data to Firebase
    set(ref(db, "rooms/" + currentRoomId), {
      roomName,
      maxStudents,
      focusMins,
      breakMins,
      hostId: userId,
      status: "WAITING",
      endTime: 0
    }).catch((err) => {
      console.error("Firebase write error:", err);
      alert("Error initializing room in database: " + err.message);
    });
  });

  // Join Room Event Handler
  document.getElementById("btn-join").addEventListener("click", () => {
    const roomId = document.getElementById("join-room-id").value.trim();
    if (!roomId) return;

    get(ref(db, `rooms/${roomId}`)).then((snapshot) => {
      if (!snapshot.exists()) {
        alert("Room not found!");
        return;
      }
      const data = snapshot.val();
      const currentUsersCount = data.users ? Object.keys(data.users).length : 0;

      if (currentUsersCount >= data.maxStudents) {
        alert(`Room is full! (Maximum limit: ${data.maxStudents} students)`);
        return;
      }

      currentRoomId = roomId;
      isHost = (data.hostId === userId);
      enterRoom(currentRoomId);
    }).catch(err => alert("Connection error: " + err.message));
  });

  function enterRoom(roomId) {
    userName = document.getElementById("user-name").value.trim() || "Student";

    document.getElementById("setup-section").classList.add("hidden");
    document.getElementById("room-section").classList.remove("hidden");
    document.getElementById("room-id-tag").innerText = roomId;

    const fullShareUrl = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
    document.getElementById("share-link-text").innerText = fullShareUrl;

    // Register User Presence in Realtime DB
    const userRef = ref(db, `rooms/${roomId}/users/${userId}`);
    set(userRef, { name: userName, isHost });
    onDisconnect(userRef).remove();

    // Listen for Room State Changes
    onValue(ref(db, `rooms/${roomId}`), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      document.getElementById("display-room-title").innerText = data.roomName;
      document.getElementById("max-count").innerText = data.maxStudents;

      if (isHost && data.status === "WAITING") {
        document.getElementById("btn-start-session").classList.remove("hidden");
      } else {
        document.getElementById("btn-start-session").classList.add("hidden");
      }

      updatePhase(data.status, data.endTime, data.focusMins, data.breakMins);
    });

    // Listen for Active Participants
    onValue(ref(db, `rooms/${roomId}/users`), (snapshot) => {
      const users = snapshot.val() || {};
      const userArray = Object.values(users);
      document.getElementById("user-count").innerText = userArray.length;

      const userList = document.getElementById("user-list");
      userList.innerHTML = userArray
        .map(u => `<div class="user-tag"><span>🎓 ${u.name}</span> ${u.isHost ? '<b style="color:#eab308; font-size:0.75rem;">HOST</b>' : ''}</div>`)
        .join("");
    });

    // Listen for Messages
    onChildAdded(ref(db, `rooms/${roomId}/messages`), (snapshot) => {
      const msg = snapshot.val();
      const box = document.getElementById("chat-box");
      box.innerHTML += `<div class="chat-msg"><strong>${msg.sender}:</strong> ${msg.text}</div>`;
      box.scrollTop = box.scrollHeight;
    });
  }

  // Host Session Start Trigger
  document.getElementById("btn-start-session").addEventListener("click", () => {
    get(ref(db, `rooms/${currentRoomId}`)).then((snapshot) => {
      const data = snapshot.val();
      const endTime = Date.now() + data.focusMins * 60 * 1000;

      update(ref(db, `rooms/${currentRoomId}`), {
        status: "FOCUS",
        endTime
      });
    });
  });

  // Copy Share Link Button
  document.getElementById("btn-copy").addEventListener("click", () => {
    const linkText = document.getElementById("share-link-text").innerText;
    navigator.clipboard.writeText(linkText).then(() => {
      const btn = document.getElementById("btn-copy");
      btn.innerText = "Copied!";
      setTimeout(() => btn.innerText = "Copy Link", 2000);
    });
  });

  function updatePhase(status, endTime, focusMins, breakMins) {
    const badge = document.getElementById("phase-badge");
    const chatInput = document.getElementById("chat-input");
    const sendBtn = document.getElementById("send-btn");
    const statusMsg = document.getElementById("chat-status-msg");

    if (status === "WAITING") {
      badge.innerText = "LOBBY - WAITING FOR HOST";
      badge.className = "badge WAITING";
      statusMsg.innerText = isHost ? "Click 'Start Study Session' when ready." : "Waiting for host to start session...";
      chatInput.disabled = true;
      sendBtn.disabled = true;
      document.getElementById("timer-display").innerText = `${String(focusMins).padStart(2, '0')}:00`;
      return;
    }

    badge.innerText = status === "FOCUS" ? "FOCUS MODE" : "BREAK TIME";
    badge.className = `badge ${status}`;

    const isFocus = status === "FOCUS";
    chatInput.disabled = isFocus;
    sendBtn.disabled = isFocus;
    statusMsg.innerText = isFocus ? "🔒 Chat is locked during Focus mode." : "🔓 Break time! Chat with your study room.";

    if (timerInterval) clearInterval(timerInterval);

    timerInterval = setInterval(() => {
      const remainingSecs = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
      
      if (remainingSecs === 0 && isHost) {
        clearInterval(timerInterval);
        toggleRoomPhase(status, focusMins, breakMins);
      }

      const mins = String(Math.floor(remainingSecs / 60)).padStart(2, '0');
      const secs = String(remainingSecs % 60).padStart(2, '0');
      document.getElementById("timer-display").innerText = `${mins}:${secs}`;
    }, 500);
  }

  function toggleRoomPhase(currentStatus, focusMins, breakMins) {
    const nextStatus = currentStatus === "FOCUS" ? "BREAK" : "FOCUS";
    const nextDuration = nextStatus === "FOCUS" ? focusMins : breakMins;
    
    update(ref(db, `rooms/${currentRoomId}`), {
      status: nextStatus,
      endTime: Date.now() + nextDuration * 60 * 1000
    });
  }

  // Chat Send Handler
  document.getElementById("send-btn").addEventListener("click", sendMessage);
  function sendMessage() {
    const input = document.getElementById("chat-input");
    if (input.value.trim()) {
      push(ref(db, `rooms/${currentRoomId}/messages`), {
        sender: userName,
        text: input.value
      });
      input.value = "";
    }
  }
</script>
</body>
</html>
