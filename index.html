<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learny - Pro Virtual Study Room</title>
  <style>
    * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
    .card { background: #171e2e; border-radius: 16px; padding: 24px; border: 1px solid #283548; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .flex { display: flex; gap: 12px; align-items: center; }
    input, select, button { padding: 12px 14px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; transition: all 0.2s; }
    input:focus, select:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
    select { cursor: pointer; }
    button { background: #2563eb; cursor: pointer; border: none; font-weight: 600; }
    button:hover { background: #1d4ed8; transform: translateY(-1px); }
    .btn-success { background: #16a34a; }
    .btn-success:hover { background: #15803d; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-secondary { background: #334155; }
    .btn-secondary:hover { background: #475569; }
    
    .timer-box { text-align: center; padding: 20px; background: #0f172a; border-radius: 14px; border: 1px solid #1e293b; margin: 15px 0; }
    .timer { font-size: 4.5rem; font-weight: 800; color: #38bdf8; margin: 5px 0; font-family: monospace; letter-spacing: -2px; }
    .badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; background: #0284c7; letter-spacing: 0.5px; }
    .badge.BREAK { background: #16a34a; }
    .badge.WAITING { background: #eab308; color: #0f172a; }

    .share-box { background: #0f172a; padding: 12px 16px; border-radius: 10px; border: 1px solid #1e293b; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 650px) { .grid { grid-template-columns: 1fr; } }
    
    #video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; width: 100%; min-height: 200px; max-height: 400px; background: #0f172a; border-radius: 12px; padding: 10px; border: 1px solid #1e293b; overflow-y: auto; }
    .video-card { position: relative; background: #000; border-radius: 8px; overflow: hidden; height: 160px; border: 1px solid #334155; }
    .video-card video { width: 100%; height: 100%; object-fit: cover; }
    .video-label { position: absolute; bottom: 6px; left: 6px; background: rgba(15, 23, 42, 0.8); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; color: #fff; font-weight: bold; }

    .chat-box { height: 180px; overflow-y: auto; background: #0f172a; padding: 12px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #1e293b; }
    .chat-msg { margin-bottom: 8px; font-size: 0.88rem; line-height: 1.4; }
    .user-tag { background: #0f172a; padding: 10px 14px; border-radius: 10px; margin-bottom: 8px; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1e293b; }
    .hidden { display: none !important; }
    
    .host-controls { background: #0f172a; padding: 12px; border-radius: 10px; border: 1px solid #1e293b; margin-top: 15px; }
    .kick-btn { padding: 4px 8px; font-size: 0.75rem; border-radius: 6px; }
    .audio-controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <div id="setup-section" class="card">
    <h2 style="margin-top:0;">Learny Virtual Study Room</h2>
    <div style="margin-bottom: 20px;">
      <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 6px;">Your Name (Required)</label>
      <input type="text" id="user-name" placeholder="Enter your name..." style="width: 100%;" />
    </div>
    
    <div class="grid">
      <div>
        <h3>Create New Room</h3>
        <input type="text" id="new-room-name" placeholder="Room Name" style="width: 100%; margin-bottom: 10px;" />
        
        <div class="flex" style="margin-bottom: 10px;">
          <div style="flex: 1;">
            <label style="font-size: 0.8rem; color: #94a3b8;">Max Capacity</label>
            <select id="max-students" style="width: 100%;">
              <option value="1">1 Student</option>
              <option value="2">2 Students</option>
              <option value="3">3 Students</option>
              <option value="4" selected>4 Students</option>
            </select>
          </div>
          <div style="flex: 1;">
            <label style="font-size: 0.8rem; color: #94a3b8;">Focus (m)</label>
            <input type="number" id="focus-mins" value="25" min="1" style="width: 100%;" />
          </div>
          <div style="flex: 1;">
            <label style="font-size: 0.8rem; color: #94a3b8;">Break (m)</label>
            <input type="number" id="break-mins" value="5" min="1" style="width: 100%;" />
          </div>
        </div>
        <button id="btn-create" style="width: 100%;">Create Room</button>
      </div>

      <div>
        <h3>Join Room</h3>
        <input type="text" id="join-room-id" placeholder="Enter Room ID" style="width: 100%; margin-bottom: 10px;" />
        <button id="btn-join" style="width: 100%;">Join Room</button>
      </div>
    </div>
  </div>

  <div id="room-section" class="card hidden">
    <div class="flex" style="justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <div>
        <h2 id="display-room-title" style="margin: 0;">Study Room</h2>
        <span id="room-id-tag" style="color: #38bdf8; font-weight: bold; font-family: monospace; font-size: 0.9rem;"></span>
      </div>
      <button id="btn-leave" class="btn-danger" style="padding: 8px 16px; font-size: 0.85rem;">🚪 Leave Room</button>
    </div>

    <div class="share-box flex" style="align-items: center; justify-content: space-between; margin-bottom: 15px;">
      <div style="font-size: 0.85rem; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px;">
        🔗 Share Link: <span id="share-link-text" style="color: #fff;"></span>
      </div>
      <button id="btn-copy" style="padding: 6px 12px; font-size: 0.8rem;">Copy Link</button>
    </div>

    <div id="video-grid"></div>
    <div class="flex" style="justify-content: center; margin-top: 10px; gap: 10px;">
      <button id="btn-toggle-mic" class="btn-secondary" style="font-size: 0.85rem;">🎤 Mic: ON</button>
      <button id="btn-toggle-cam" class="btn-secondary" style="font-size: 0.85rem;">📹 Cam: ON</button>
    </div>

    <div class="timer-box">
      <span id="phase-badge" class="badge WAITING">WAITING FOR HOST TO START</span>
      <div id="timer-display" class="timer">25:00</div>
      
      <div class="audio-controls">
        <button id="btn-toggle-tick" class="btn-secondary" style="font-size: 0.8rem; padding: 6px 12px;">🔊 Tick Sound: OFF</button>
      </div>

      <div id="host-panel" class="host-controls hidden">
        <div class="flex" style="justify-content: center; gap: 10px; flex-wrap: wrap;">
          <button id="btn-start-session" class="btn-success" style="font-size: 1rem; padding: 10px 20px;">🚀 Start Session</button>
          <button id="btn-toggle-mute-chat" class="btn-secondary" style="font-size: 0.85rem;">💬 Mute Chat: OFF</button>
        </div>
      </div>

      <p id="chat-status-msg" style="color: #94a3b8; font-size: 0.85rem; margin-top: 15px;">
        ⏳ Waiting for participants to join...
      </p>
    </div>

    <div class="grid">
      <div>
        <h3>Room Chat</h3>
        <div id="chat-box" class="chat-box"></div>
        <div class="flex">
          <input type="text" id="chat-input" placeholder="Break mode chat..." style="flex: 1;" disabled />
          <button id="send-btn" disabled>Send</button>
        </div>
      </div>

      <div>
        <h3>Students (<span id="user-count">0</span>/<span id="max-count">4</span>)</h3>
        <div id="user-list"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { 
    getDatabase, ref, set, update, remove, onValue, onChildAdded, push, onDisconnect, get 
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCgPaCkohoVx6rXHAbQhk80R3EvncVkxx4",
    authDomain: "rooms-7a301.firebaseapp.com",
    databaseURL: "https://rooms-7a301-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "rooms-7a301",
    storageBucket: "rooms-7a301.firebasestorage.app",
    messagingSenderId: "588297268013",
    appId: "1:588297268013:web:51de1add5257a368f781a4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let currentRoomId = localStorage.getItem("learny_room_id") || "";
  let userName = localStorage.getItem("learny_user_name") || "";
  let userId = localStorage.getItem("learny_user_id");
  if (!userId) {
    userId = "usr_" + Math.random().toString(36).substr(2, 6);
    localStorage.setItem("learny_user_id", userId);
  }

  let isHost = false;
  let timerInterval = null;
  let tickSoundEnabled = false;
  let chatMutedByHost = false;
  let audioCtx = null;

  let localStream = null;
  const peerConnections = {};
  const iceCandidatesQueue = {};

  const iceServers = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" }
    ]
  };

  async function startLocalMedia() {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    } catch (err) {
      console.warn("Camera/Mic access declined or unavailable:", err);
      localStream = new MediaStream();
    }
    addVideoCard(userId, userName, localStream, true);
  }

  function addVideoCard(id, label, stream, isMuted = false) {
    let card = document.getElementById(`vcard-${id}`);
    if (!card) {
      card = document.createElement("div");
      card.id = `vcard-${id}`;
      card.className = "video-card";
      
      const videoEl = document.createElement("video");
      videoEl.id = `vvid-${id}`;
      videoEl.autoplay = true;
      videoEl.playsInline = true;
      videoEl.muted = isMuted;
      
      const labelEl = document.createElement("div");
      labelEl.className = "video-label";
      labelEl.innerText = isMuted ? `${label} (You)` : label;
      
      card.appendChild(videoEl);
      card.appendChild(labelEl);
      document.getElementById("video-grid").appendChild(card);
    }

    const videoElem = document.getElementById(`vvid-${id}`);
    if (videoElem) {
      if (videoElem.srcObject !== stream) {
        videoElem.srcObject = stream;
      }
      videoElem.play().catch(e => {
        if (!isMuted) {
          videoElem.muted = true;
          videoElem.play().catch(err => console.error(err));
        }
      });
    }
  }

  function removeVideoCard(id) {
    const card = document.getElementById(`vcard-${id}`);
    if (card) card.remove();
    if (peerConnections[id]) {
      peerConnections[id].close();
      delete peerConnections[id];
      delete iceCandidatesQueue[id];
    }
  }

  function createPeerConnection(remoteUserId, remoteUserName, isInitiator) {
    if (peerConnections[remoteUserId]) return peerConnections[remoteUserId];

    const pc = new RTCPeerConnection(iceServers);
    peerConnections[remoteUserId] = pc;
    iceCandidatesQueue[remoteUserId] = [];

    if (localStream) {
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    }

    pc.ontrack = (event) => {
      const remoteStream = event.streams[0] || new MediaStream([event.track]);
      addVideoCard(remoteUserId, remoteUserName, remoteStream, false);
    };

    pc.onicecandidate = (event) => {
      if (event.candidate) {
        push(ref(db, `rooms/${currentRoomId}/signal/${remoteUserId}/${userId}/candidates`), event.candidate.toJSON());
      }
    };

    if (isInitiator) {
      pc.createOffer({ offerToReceiveVideo: true, offerToReceiveAudio: true })
        .then(offer => pc.setLocalDescription(offer))
        .then(() => {
          set(ref(db, `rooms/${currentRoomId}/signal/${remoteUserId}/${userId}/offer`), {
            type: pc.localDescription.type,
            sdp: pc.localDescription.sdp,
            senderName: userName
          });
        }).catch(e => console.error("Offer Error:", e));
    }

    return pc;
  }

  function processBufferedCandidates(remoteUserId) {
    const pc = peerConnections[remoteUserId];
    const queue = iceCandidatesQueue[remoteUserId];
    if (pc && queue && pc.remoteDescription) {
      while (queue.length > 0) {
        const cand = queue.shift();
        pc.addIceCandidate(new RTCIceCandidate(cand)).catch(e => console.error(e));
      }
    }
  }

  function listenForWebRTCSignals() {
    const signalRef = ref(db, `rooms/${currentRoomId}/signal/${userId}`);
    
    onChildAdded(signalRef, (snapshot) => {
      const senderId = snapshot.key;
      const dataRef = ref(db, `rooms/${currentRoomId}/signal/${userId}/${senderId}`);

      onValue(dataRef, (dataSnap) => {
        const data = dataSnap.val();
        if (!data) return;

        if (data.offer) {
          const pc = createPeerConnection(senderId, data.offer.senderName || "Student", false);
          if (pc.signalingState === "stable" || pc.signalingState === "have-remote-offer") {
            pc.setRemoteDescription(new RTCSessionDescription(data.offer))
              .then(() => {
                processBufferedCandidates(senderId);
                return pc.createAnswer();
              })
              .then(answer => pc.setLocalDescription(answer))
              .then(() => {
                set(ref(db, `rooms/${currentRoomId}/signal/${senderId}/${userId}/answer`), {
                  type: pc.localDescription.type,
                  sdp: pc.localDescription.sdp
                });
              }).catch(e => console.error("Answer Error:", e));
          }
        }

        if (data.answer && peerConnections[senderId]) {
          const pc = peerConnections[senderId];
          if (pc.signalingState === "have-local-offer") {
            pc.setRemoteDescription(new RTCSessionDescription(data.answer))
              .then(() => processBufferedCandidates(senderId))
              .catch(e => console.error("Remote Desc Error:", e));
          }
        }
      });

      onChildAdded(ref(db, `rooms/${currentRoomId}/signal/${userId}/${senderId}/candidates`), (candSnap) => {
        const cand = candSnap.val();
        const pc = peerConnections[senderId];
        if (cand) {
          if (pc && pc.remoteDescription) {
            pc.addIceCandidate(new RTCIceCandidate(cand)).catch(e => console.error(e));
          } else {
            if (!iceCandidatesQueue[senderId]) iceCandidatesQueue[senderId] = [];
            iceCandidatesQueue[senderId].push(cand);
          }
        }
      });
    });
  }

  function playTickSound() {
    if (!tickSoundEnabled) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    } catch (e) { console.error(e); }
  }

  function validateUserName() {
    const input = document.getElementById("user-name").value.trim();
    if (!input) {
      alert("Please enter your name before creating or joining a room!");
      return null;
    }
    userName = input;
    localStorage.setItem("learny_user_name", userName);
    return userName;
  }

  function generateRoomId(name) {
    const code = Math.random().toString(36).substring(2, 6);
    const prefix = (name || "room").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 4);
    return `${prefix}-${code}`;
  }

  window.addEventListener("DOMContentLoaded", () => {
    if (userName) document.getElementById("user-name").value = userName;
    
    const urlParams = new URLSearchParams(window.location.search);
    const roomIdFromUrl = urlParams.get("room");
    if (roomIdFromUrl) {
      document.getElementById("join-room-id").value = roomIdFromUrl;
    }

    if (currentRoomId && userName) {
      get(ref(db, `rooms/${currentRoomId}`)).then((snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          isHost = (data.hostId === userId);
          enterRoom(currentRoomId);
        } else {
          localStorage.removeItem("learny_room_id");
        }
      });
    }
  });

  document.getElementById("btn-create").addEventListener("click", () => {
    if (!validateUserName()) return;

    const roomName = document.getElementById("new-room-name").value || "Study Room";
    const maxStudents = parseInt(document.getElementById("max-students").value) || 4;
    const focusMins = parseInt(document.getElementById("focus-mins").value) || 25;
    const breakMins = parseInt(document.getElementById("break-mins").value) || 5;

    currentRoomId = generateRoomId(roomName);
    isHost = true;

    localStorage.setItem("learny_room_id", currentRoomId);
    enterRoom(currentRoomId);

    set(ref(db, "rooms/" + currentRoomId), {
      roomName,
      maxStudents,
      focusMins,
      breakMins,
      hostId: userId,
      status: "WAITING",
      endTime: 0,
      chatMuted: false
    });
  });

  document.getElementById("btn-join").addEventListener("click", () => {
    if (!validateUserName()) return;

    const roomId = document.getElementById("join-room-id").value.trim();
    if (!roomId) return;

    get(ref(db, `rooms/${roomId}`)).then((snapshot) => {
      if (!snapshot.exists()) {
        alert("Room not found!");
        return;
      }
      const data = snapshot.val();
      const currentUsersCount = data.users ? Object.keys(data.users).length : 0;

      if (currentUsersCount >= data.maxStudents && !data.users[userId]) {
        alert(`Room is full! (Max Limit: ${data.maxStudents} students)`);
        return;
      }

      currentRoomId = roomId;
      isHost = (data.hostId === userId);
      localStorage.setItem("learny_room_id", currentRoomId);
      enterRoom(currentRoomId);
    });
  });

  document.getElementById("btn-leave").addEventListener("click", leaveRoom);

  function leaveRoom() {
    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
    }
    if (currentRoomId && userId) {
      remove(ref(db, `rooms/${currentRoomId}/users/${userId}`));
      remove(ref(db, `rooms/${currentRoomId}/signal/${userId}`));
    }
    localStorage.removeItem("learny_room_id");
    location.reload();
  }

  async function enterRoom(roomId) {
    document.getElementById("setup-section").classList.add("hidden");
    document.getElementById("room-section").classList.remove("hidden");
    document.getElementById("room-id-tag").innerText = roomId;

    const fullShareUrl = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
    document.getElementById("share-link-text").innerText = fullShareUrl;

    await startLocalMedia();
    listenForWebRTCSignals();

    const userRef = ref(db, `rooms/${roomId}/users/${userId}`);
    set(userRef, { name: userName, isHost });
    onDisconnect(userRef).remove();
    onDisconnect(ref(db, `rooms/${roomId}/signal/${userId}`)).remove();

    if (isHost) {
      document.getElementById("host-panel").classList.remove("hidden");
    }

    onValue(ref(db, `rooms/${roomId}`), (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        alert("Room has been closed by host.");
        leaveRoom();
        return;
      }

      if (data.users && !data.users[userId]) {
        alert("You have been removed from the room by the Host.");
        leaveRoom();
        return;
      }

      document.getElementById("display-room-title").innerText = data.roomName;
      document.getElementById("max-count").innerText = data.maxStudents;
      chatMutedByHost = !!data.chatMuted;

      const muteBtn = document.getElementById("btn-toggle-mute-chat");
      muteBtn.innerText = `💬 Mute Chat: ${chatMutedByHost ? 'ON' : 'OFF'}`;
      muteBtn.className = chatMutedByHost ? "btn-danger" : "btn-secondary";

      if (isHost && data.status === "WAITING") {
        document.getElementById("btn-start-session").classList.remove("hidden");
      } else {
        document.getElementById("btn-start-session").classList.add("hidden");
      }

      updatePhase(data.status, data.endTime, data.focusMins, data.breakMins);
    });

    onValue(ref(db, `rooms/${roomId}/users`), (snapshot) => {
      const users = snapshot.val() || {};
      const userEntries = Object.entries(users);
      document.getElementById("user-count").innerText = userEntries.length;

      userEntries.forEach(([remoteId, u]) => {
        if (remoteId !== userId && !peerConnections[remoteId]) {
          const isInitiator = userId < remoteId;
          createPeerConnection(remoteId, u.name, isInitiator);
        }
      });

      Object.keys(peerConnections).forEach(pId => {
        if (!users[pId]) removeVideoCard(pId);
      });

      const userList = document.getElementById("user-list");
      userList.innerHTML = userEntries
        .map(([id, u]) => `
          <div class="user-tag">
            <span>🎓 ${u.name} ${u.isHost ? '<b style="color:#eab308; font-size:0.75rem;">HOST</b>' : ''}</span>
            ${isHost && id !== userId ? `<button class="btn-danger kick-btn" onclick="window.kickUser('${id}')">Remove</button>` : ''}
          </div>
        `).join("");
    });

    onChildAdded(ref(db, `rooms/${roomId}/messages`), (snapshot) => {
      const msg = snapshot.val();
      const box = document.getElementById("chat-box");
      box.innerHTML += `<div class="chat-msg"><strong>${msg.sender}:</strong> ${msg.text}</div>`;
      box.scrollTop = box.scrollHeight;
    });
  }

  document.getElementById("btn-toggle-mic").addEventListener("click", () => {
    if (!localStream) return;
    const audioTrack = localStream.getAudioTracks()[0];
    if (audioTrack) {
      audioTrack.enabled = !audioTrack.enabled;
      const btn = document.getElementById("btn-toggle-mic");
      btn.innerText = `🎤 Mic: ${audioTrack.enabled ? 'ON' : 'OFF'}`;
      btn.className = audioTrack.enabled ? "btn-secondary" : "btn-danger";
    }
  });

  document.getElementById("btn-toggle-cam").addEventListener("click", () => {
    if (!localStream) return;
    const videoTrack = localStream.getVideoTracks()[0];
    if (videoTrack) {
      videoTrack.enabled = !videoTrack.enabled;
      const btn = document.getElementById("btn-toggle-cam");
      btn.innerText = `📹 Cam: ${videoTrack.enabled ? 'ON' : 'OFF'}`;
      btn.className = videoTrack.enabled ? "btn-secondary" : "btn-danger";
    }
  });

  window.kickUser = function(targetUserId) {
    if (confirm("Remove this student from the room?")) {
      remove(ref(db, `rooms/${currentRoomId}/users/${targetUserId}`));
    }
  };

  document.getElementById("btn-toggle-tick").addEventListener("click", () => {
    tickSoundEnabled = !tickSoundEnabled;
    const btn = document.getElementById("btn-toggle-tick");
    btn.innerText = `🔊 Tick Sound: ${tickSoundEnabled ? 'ON' : 'OFF'}`;
    btn.className = tickSoundEnabled ? "btn-success" : "btn-secondary";
  });

  document.getElementById("btn-toggle-mute-chat").addEventListener("click", () => {
    update(ref(db, `rooms/${currentRoomId}`), {
      chatMuted: !chatMutedByHost
    });
  });

  document.getElementById("btn-start-session").addEventListener("click", () => {
    get(ref(db, `rooms/${currentRoomId}`)).then((snapshot) => {
      const data = snapshot.val();
      const endTime = Date.now() + data.focusMins * 60 * 1000;

      update(ref(db, `rooms/${currentRoomId}`), {
        status: "FOCUS",
        endTime
      });
    });
  });

  document.getElementById("btn-copy").addEventListener("click", () => {
    const linkText = document.getElementById("share-link-text").innerText;
    navigator.clipboard.writeText(linkText).then(() => {
      const btn = document.getElementById("btn-copy");
      btn.innerText = "Copied!";
      setTimeout(() => btn.innerText = "Copy Link", 2000);
    });
  });

  function updatePhase(status, endTime, focusMins, breakMins) {
    const badge = document.getElementById("phase-badge");
    const chatInput = document.getElementById("chat-input");
    const sendBtn = document.getElementById("send-btn");
    const statusMsg = document.getElementById("chat-status-msg");

    if (status === "WAITING") {
      badge.innerText = "LOBBY - WAITING FOR HOST";
      badge.className = "badge WAITING";
      statusMsg.innerText = isHost ? "Click 'Start Session' when ready." : "Waiting for host to start session...";
      chatInput.disabled = true;
      sendBtn.disabled = true;
      document.getElementById("timer-display").innerText = `${String(focusMins).padStart(2, '0')}:00`;
      return;
    }

    badge.innerText = status === "FOCUS" ? "FOCUS MODE" : "BREAK TIME";
    badge.className = `badge ${status}`;

    const isFocus = status === "FOCUS";
    const canChat = !isFocus && !chatMutedByHost;

    chatInput.disabled = !canChat;
    sendBtn.disabled = !canChat;

    if (isFocus) {
      statusMsg.innerText = "🔒 Chat is locked during Focus mode.";
    } else if (chatMutedByHost) {
      statusMsg.innerText = "🚫 Chat has been restricted by the Host.";
    } else {
      statusMsg.innerText = "🔓 Break time! Chat is open.";
    }

    if (timerInterval) clearInterval(timerInterval);

    timerInterval = setInterval(() => {
      const remainingSecs = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
      
      playTickSound();

      if (remainingSecs === 0 && isHost) {
        clearInterval(timerInterval);
        toggleRoomPhase(status, focusMins, breakMins);
      }

      const mins = String(Math.floor(remainingSecs / 60)).padStart(2, '0');
      const secs = String(remainingSecs % 60).padStart(2, '0');
      document.getElementById("timer-display").innerText = `${mins}:${secs}`;
    }, 1000);
  }

  function toggleRoomPhase(currentStatus, focusMins, breakMins) {
    const nextStatus = currentStatus === "FOCUS" ? "BREAK" : "FOCUS";
    const nextDuration = nextStatus === "FOCUS" ? focusMins : breakMins;
    
    update(ref(db, `rooms/${currentRoomId}`), {
      status: nextStatus,
      endTime: Date.now() + nextDuration * 60 * 1000
    });
  }

  document.getElementById("send-btn").addEventListener("click", sendMessage);
  function sendMessage() {
    const input = document.getElementById("chat-input");
    if (input.value.trim() && !chatMutedByHost) {
      push(ref(db, `rooms/${currentRoomId}/messages`), {
        sender: userName,
        text: input.value
      });
      input.value = "";
    }
  }
</script>
</body>
</html>
