<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learny - Community Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    
    .chat-container { display: flex; width: 100%; max-width: 1000px; height: 85vh; background: #1e293b; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    
    /* Sidebar */
    .sidebar { width: 340px; background: #0f172a; display: flex; flex-direction: column; border-right: 1px solid #334155; }
    .user-profile { padding: 16px; background: #1e293b; border-bottom: 1px solid #334155; }
    .user-profile .my-id { font-size: 13px; color: #38bdf8; font-weight: bold; margin-top: 4px; }
    
    .add-contact-box { padding: 12px; display: flex; gap: 8px; border-bottom: 1px solid #334155; }
    .add-contact-box input { flex: 1; padding: 8px 12px; background: #1e293b; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 13px; }
    .add-contact-box button { padding: 8px 12px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    
    .section-title { padding: 10px 16px 4px; font-size: 11px; font-weight: bold; color: #64748b; text-transform: uppercase; }
    .contact-list { flex: 1; overflow-y: auto; }
    .contact-item { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid #1e293b; }
    .contact-item:hover, .contact-item.active { background: #334155; }
    .contact-item .name { font-weight: 600; font-size: 14px; }
    .contact-item .status { font-size: 11px; padding: 2px 6px; border-radius: 4px; }
    .status.pending { background: #ca8a04; color: #fef08a; }
    .status.accepted { background: #166534; color: #bbf7d0; }
    
    .req-btn { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; margin-left: 4px; }
    .btn-accept { background: #22c55e; color: white; }

    /* Chat Section */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #1e293b; }
    .chat-header { padding: 16px; background: #0f172a; border-bottom: 1px solid #334155; font-weight: bold; }
    
    .messages-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 65%; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.4; }
    .message.sent { align-self: flex-end; background: #0284c7; color: white; border-bottom-right-radius: 2px; }
    .message.received { align-self: flex-start; background: #334155; color: white; border-bottom-left-radius: 2px; }
    
    .chat-input-area { padding: 12px; background: #0f172a; display: flex; gap: 8px; border-top: 1px solid #334155; }
    .chat-input-area input { flex: 1; padding: 10px 14px; background: #1e293b; border: 1px solid #475569; border-radius: 6px; color: white; }
    .chat-input-area button { padding: 10px 18px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .chat-input-area input:disabled, .chat-input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="chat-container">
  <!-- Left Sidebar -->
  <div class="sidebar">
    <div class="user-profile">
      <div id="myUsername">Connecting...</div>
      <div class="my-id" id="myChatId">Chat ID: ---</div>
    </div>
    
    <div class="add-contact-box">
      <input type="text" id="targetChatId" placeholder="Enter Chat ID (e.g. LRN-1102)">
      <button id="sendReqBtn">Add</button>
    </div>

    <div class="section-title">Contacts & Requests</div>
    <div class="contact-list" id="contactList"></div>
  </div>

  <!-- Right Chat Area -->
  <div class="chat-area">
    <div class="chat-header" id="chatHeader">
      Select a contact to start chatting
    </div>

    <div class="messages-box" id="messagesBox"></div>

    <div class="chat-input-area">
      <input type="text" id="messageInput" placeholder="Type your message here..." disabled>
      <button id="sendMsgBtn" disabled>Send</button>
    </div>
  </div>
</div>

<!-- Firebase SDK Module -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";
  import { 
    getAuth, 
    signInAnonymously, 
    onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { 
    getFirestore, 
    doc, 
    getDoc, 
    setDoc, 
    addDoc, 
    updateDoc, 
    collection, 
    query, 
    where, 
    orderBy, 
    onSnapshot, 
    getDocs, 
    serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // Configured Firebase Credentials
  const firebaseConfig = {
    apiKey: "AIzaSyBguApS0wRuiarK1djIg0eltnAv-1E5DJI",
    authDomain: "lrnchat-2b76f.firebaseapp.com",
    projectId: "lrnchat-2b76f",
    storageBucket: "lrnchat-2b76f.firebasestorage.app",
    messagingSenderId: "931919499161",
    appId: "1:931919499161:web:33f96dde96a3400d06cd08",
    measurementId: "G-1DKG1MY499"
  };

  // Initialize Services
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentUserData = null;
  let activeChatUserId = null;
  let activeChatUnsubscribe = null;

  // Authenticate User & Set User Chat ID
  signInAnonymously(auth).catch(console.error);

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      const userRef = doc(db, 'users', user.uid);
      const userSnap = await getDoc(userRef);

      if (!userSnap.exists()) {
        const randomId = 'LRN-' + Math.floor(1000 + Math.random() * 9000);
        currentUserData = {
          username: 'Student_' + user.uid.substring(0, 4),
          chatId: randomId
        };
        await setDoc(userRef, currentUserData);
      } else {
        currentUserData = userSnap.data();
      }

      document.getElementById('myUsername').innerText = currentUserData.username;
      document.getElementById('myChatId').innerText = `Chat ID: ${currentUserData.chatId}`;

      listenToRequestsAndContacts();
    }
  });

  // Send Connection Request
  document.getElementById('sendReqBtn').addEventListener('click', async () => {
    const targetId = document.getElementById('targetChatId').value.trim();
    if (!targetId || targetId === currentUserData.chatId) return;

    const q = query(collection(db, 'users'), where('chatId', '==', targetId));
    const querySnap = await getDocs(q);

    if (querySnap.empty) {
      alert('Chat ID not found!');
      return;
    }

    const targetUserDoc = querySnap.docs[0];
    const receiverId = targetUserDoc.id;

    await addDoc(collection(db, 'requests'), {
      senderId: currentUser.uid,
      senderChatId: currentUserData.chatId,
      receiverId: receiverId,
      receiverChatId: targetId,
      status: 'pending',
      createdAt: serverTimestamp()
    });

    alert('Request Sent!');
    document.getElementById('targetChatId').value = '';
  });

  // Listen for Sidebar Updates
  function listenToRequestsAndContacts() {
    const qSent = query(collection(db, 'requests'), where('senderId', '==', currentUser.uid));
    const qReceived = query(collection(db, 'requests'), where('receiverId', '==', currentUser.uid));

    let requestsMap = new Map();

    const render = () => {
      const container = document.getElementById('contactList');
      container.innerHTML = '';

      requestsMap.forEach((req, reqId) => {
        const item = document.createElement('div');
        item.className = 'contact-item';

        if (req.status === 'pending' && req.receiverId === currentUser.uid) {
          item.innerHTML = `
            <div>
              <div class="name">Incoming Request</div>
              <div style="font-size:11px; color:#94a3b8">${req.senderChatId}</div>
            </div>
            <div>
              <button class="req-btn btn-accept" id="acc-${reqId}">Accept</button>
            </div>`;
          container.appendChild(item);
          document.getElementById(`acc-${reqId}`).onclick = () => acceptRequest(reqId, req.senderId);
        } else if (req.status === 'accepted') {
          const otherUserId = req.senderId === currentUser.uid ? req.receiverId : req.senderId;
          const otherChatId = req.senderId === currentUser.uid ? req.receiverChatId : req.senderChatId;
          
          item.innerHTML = `
            <div>
              <div class="name">Student Connection</div>
              <div style="font-size:11px; color:#94a3b8">${otherChatId}</div>
            </div>
            <span class="status accepted">Accepted</span>`;
          item.onclick = () => openChat(otherUserId, otherChatId);
          container.appendChild(item);
        }
      });
    };

    onSnapshot(qSent, (snap) => {
      snap.docs.forEach(doc => requestsMap.set(doc.id, doc.data()));
      render();
    });

    onSnapshot(qReceived, (snap) => {
      snap.docs.forEach(doc => requestsMap.set(doc.id, doc.data()));
      render();
    });
  }

  // Accept Connection Request
  async function acceptRequest(requestId, senderId) {
    await updateDoc(doc(db, 'requests', requestId), { status: 'accepted' });

    const chatDocId = [currentUser.uid, senderId].sort().join('_');
    await setDoc(doc(db, 'chats', chatDocId), {
      members: [currentUser.uid, senderId],
      updatedAt: serverTimestamp()
    }, { merge: true });
  }

  // Open Chat Room
  function openChat(otherUserId, otherChatId) {
    activeChatUserId = otherUserId;
    document.getElementById('chatHeader').innerText = `Chatting with (${otherChatId})`;
    document.getElementById('messageInput').disabled = false;
    document.getElementById('sendMsgBtn').disabled = false;

    if (activeChatUnsubscribe) activeChatUnsubscribe();

    const chatDocId = [currentUser.uid, otherUserId].sort().join('_');
    const messagesRef = collection(db, 'chats', chatDocId, 'messages');
    const q = query(messagesRef, orderBy('createdAt', 'asc'));

    activeChatUnsubscribe = onSnapshot(q, (snapshot) => {
      const messagesBox = document.getElementById('messagesBox');
      messagesBox.innerHTML = '';

      snapshot.docs.forEach((doc) => {
        const data = doc.data();
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${data.senderId === currentUser.uid ? 'sent' : 'received'}`;
        msgDiv.innerText = data.text;
        messagesBox.appendChild(msgDiv);
      });

      messagesBox.scrollTop = messagesBox.scrollHeight;
    });
  }

  // Send Message
  document.getElementById('sendMsgBtn').addEventListener('click', sendMessage);
  async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text || !activeChatUserId) return;

    const chatDocId = [currentUser.uid, activeChatUserId].sort().join('_');
    await addDoc(collection(db, 'chats', chatDocId, 'messages'), {
      senderId: currentUser.uid,
      text: text,
      createdAt: serverTimestamp()
    });

    input.value = '';
  }
</script>
</body>
</html>
